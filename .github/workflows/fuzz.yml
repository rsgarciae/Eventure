name: Fuzz

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  dates:
    name: Fuzz the date parser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install fuzzer
        # Hashed, so a tampered wheel cannot slip into CI.
        run: python -m pip install --require-hashes -r fuzz/requirements.txt

      - name: Fuzz for 60 seconds
        run: python fuzz/fuzz_dates.py -max_total_time=60 -print_final_stats=1

      - name: Keep a crashing input, if any
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: crash-*
          if-no-files-found: ignore
          retention-days: 7
